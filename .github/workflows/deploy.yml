name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: new-portfolio
        run: npm ci

      - name: Build new portfolio
        working-directory: new-portfolio
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir pages-artifact
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='new-portfolio/' \
            --exclude='pages-artifact/' \
            ./ pages-artifact/
          rsync -a new-portfolio/dist/ pages-artifact/
          touch pages-artifact/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
